name: Build FPSOverlay deb

on:

  workflow_dispatch:

  push:

    branches: ["main"]

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout source

        uses: actions/checkout@v4

      - name: Install dependencies

        run: |

          sudo apt-get update

          sudo apt-get install -y build-essential clang lld llvm git perl make curl ca-certificates fakeroot dpkg-dev

      - name: Install Theos

        run: |

          git clone --depth=1 https://github.com/theos/theos.git "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK

        run: |

          mkdir -p "$HOME/theos/sdks"

          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos-sdks"

          cp -R "$HOME/theos-sdks/iPhoneOS"*.sdk "$HOME/theos/sdks/"

      - name: Build package

        run: |

          make clean

          make package THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb

        uses: actions/upload-artifact@v4

        with:

          name: FPSOverlay-deb

          path: packages/*.deb

          if-no-files-found: error
