name: Build FPSOverlay

on:

  workflow_dispatch:

  push:

    branches:

      - main

permissions:

  contents: read

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Check repository files

        run: |

          echo "Checking repository files..."

          ls -la

          find . -maxdepth 3 -type f
        
